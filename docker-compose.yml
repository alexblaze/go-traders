# Local development / demo stack:  cp .env.example .env && docker compose up
#   Frontend http://localhost:3000 · API http://localhost:4000 · Swagger http://localhost:4000/docs
name: nepse-trading-platform

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-nepse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nepse}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-csv}
  MARKET_DATA_CSV_DIR: /app/data/sample
  NEPSE_API_BASE_URL: ${NEPSE_API_BASE_URL:-}
  NEPSE_API_KEY: ${NEPSE_API_KEY:-}
  AI_PROVIDER: ${AI_PROVIDER:-template}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-alerts@nepse-platform.local}
  LIVE_TRADING_ENABLED: "false"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nepse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nepse}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nepse} -d ${POSTGRES_DB:-nepse}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${IMAGE_PREFIX:-nepse}-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-bookworm-slim}" }
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: 4000
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_DATA_DIR: /app/data/sample
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${API_PORT:-4000}:4000"]

  worker:
    image: ${IMAGE_PREFIX:-nepse}-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
      args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-bookworm-slim}" }
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      api: { condition: service_healthy }

  frontend:
    image: ${IMAGE_PREFIX:-nepse}-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:22-bookworm-slim}"
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["${WEB_PORT:-3000}:3000"]

volumes:
  pgdata:
  redisdata:
