name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nepse, POSTGRES_PASSWORD: nepse, POSTGRES_DB: nepse_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nepse" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://nepse:nepse@localhost:5432/nepse_test
      TEST_REDIS_URL: redis://localhost:6379/15
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run --project unit
      - run: pnpm vitest run --project integration
      - run: pnpm test:web
      - run: pnpm build
